<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeLeTV — 粗野实验</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Space Grotesk', 'Noto Sans SC', system-ui, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* 导航 — 粗野 */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px;
    border-bottom: 3px solid #fff;
    height: 72px;
  }
  .logo {
    font-size: 28px; font-weight: 900; letter-spacing: -1px;
    text-transform: uppercase;
  }
  .logo span { background: #ec4899; color: #000; padding: 2px 8px; }
  .nav-links { display: flex; height: 100%; }
  .nav-links a {
    color: #fff; text-decoration: none; font-size: 15px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    padding: 0 24px; display: flex; align-items: center;
    border-left: 2px solid #333; transition: all .2s;
  }
  .nav-links a:hover { background: #fff; color: #000; }
  .nav-links a.active { background: #ec4899; color: #000; border-left-color: #ec4899; }
  .search-box {
    background: transparent; border: 3px solid #fff;
    padding: 10px 16px; width: 240px;
    color: #fff; font-size: 14px; font-weight: 600;
    outline: none; font-family: inherit;
    transition: all .2s;
  }
  .search-box:focus { background: #ec4899; border-color: #ec4899; color: #000; }
  .search-box::placeholder { color: #666; font-weight: 500; }
  .search-box:focus::placeholder { color: rgba(0,0,0,0.5); }

  /* Hero — 超大字 */
  .hero {
    padding: 60px 40px 40px;
    border-bottom: 3px solid #fff;
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: end;
  }
  .hero-title {
    font-size: 88px; font-weight: 900; line-height: 0.9;
    letter-spacing: -3px; text-transform: uppercase;
  }
  .hero-title .accent { color: #ec4899; }
  .hero-title .outline {
    -webkit-text-stroke: 2px #fff; color: transparent;
  }
  .hero-right { text-align: right; }
  .hero-meta {
    font-size: 14px; color: #888; font-weight: 600;
    text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 16px;
  }
  .hero-desc {
    font-size: 16px; color: #ccc; line-height: 1.6;
    max-width: 400px; margin-left: auto; margin-bottom: 24px;
  }
  .btn-brutal {
    background: #ec4899; color: #000;
    border: 3px solid #ec4899;
    padding: 16px 36px; font-size: 16px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .btn-brutal:hover { background: #fff; border-color: #fff; transform: translate(-3px,-3px); box-shadow: 6px 6px 0 #ec4899; }
  .btn-brutal-outline {
    background: transparent; color: #fff;
    border: 3px solid #fff;
    padding: 16px 28px; font-size: 16px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; font-family: inherit; margin-left: 12px;
    transition: all .15s;
  }
  .btn-brutal-outline:hover { background: #fff; color: #000; }

  /* 跑马灯 */
  .marquee {
    background: #ec4899; color: #000;
    padding: 12px 0; overflow: hidden;
    border-bottom: 3px solid #fff;
    white-space: nowrap;
  }
  .marquee-inner {
    display: inline-block; animation: scroll 20s linear infinite;
    font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
  }
  .marquee-inner span { margin: 0 32px; }
  @keyframes scroll { 0%{transform:translateX(0);} 100%{transform:translateX(-50%);} }

  /* 区块 */
  .section { padding: 40px; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 2px solid #333;
  }
  .section-title {
    font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px;
  }
  .section-title em { font-style: normal; color: #ec4899; }
  .section-count { font-size: 14px; color: #666; font-weight: 700; }

  /* 卡片 — 粗野 */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 2px solid #333; }
  .card {
    cursor: pointer; border-right: 2px solid #333; border-bottom: 2px solid #333;
    transition: all .15s; position: relative;
  }
  .card:nth-child(4n) { border-right: none; }
  .card:nth-last-child(-n+4) { border-bottom: none; }
  .card:hover { background: #ec4899; }
  .card-poster {
    aspect-ratio: 16/10; overflow: hidden; position: relative;
    border-bottom: 3px solid #fff;
  }
  .card-poster img { width:100%; height:100%; object-fit:cover; filter: grayscale(30%); transition: filter .3s; }
  .card:hover .card-poster img { filter: grayscale(0%); }
  .card-num {
    position: absolute; top: 12px; left: 12px;
    font-size: 48px; font-weight: 900; color: #fff;
    text-shadow: 2px 2px 0 #000; line-height: 1;
  }
  .card-body { padding: 16px; }
  .card-title {
    font-size: 18px; font-weight: 900; text-transform: uppercase;
    letter-spacing: -0.3px; margin-bottom: 6px;
    transition: color .15s;
  }
  .card:hover .card-title { color: #000; }
  .card-meta {
    font-size: 12px; color: #888; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    transition: color .15s;
  }
  .card:hover .card-meta { color: rgba(0,0,0,0.6); }
  .card-tag {
    display: inline-block; margin-top: 10px;
    border: 2px solid currentColor; padding: 3px 10px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
  }

  footer {
    border-top: 3px solid #fff; padding: 32px 40px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-logo { font-size: 24px; font-weight: 900; text-transform: uppercase; }
  .footer-logo span { background: #ec4899; color: #000; padding: 2px 8px; }
  .footer-copy { font-size: 13px; color: #666; font-weight: 600; text-transform: uppercase; }
</style>
</head>
<body>
  <nav>
    <div class="logo">LeLe<span>TV</span></div>
    <div class="nav-links">
      <a href="#" class="active">首页</a>
      <a href="#">电影</a>
      <a href="#">剧集</a>
      <a href="#">动漫</a>
      <a href="#">综艺</a>
    </div>
    <input class="search-box" placeholder="搜索 // SEARCH">
  </nav>

  <div class="hero">
    <div class="hero-grid">
      <div>
        <h1 class="hero-title">
          看片<br>
          <span class="accent">就要</span><br>
          <span class="outline">够狠</span>
        </h1>
      </div>
      <div class="hero-right">
        <div class="hero-meta">// 本周主打</div>
        <p class="hero-desc">没有圆角，没有渐变，没有废话。只有最原始的视觉冲击和最直接的内容呈现。</p>
        <div>
          <button class="btn-brutal">▶ 播放</button>
          <button class="btn-brutal-outline">收藏</button>
        </div>
      </div>
    </div>
  </div>

  <div class="marquee">
    <div class="marquee-inner">
      <span>★ 新片上线</span><span>★ 高清画质</span><span>★ 极速播放</span><span>★ 全网搜索</span><span>★ 免费观看</span><span>★ 无广告</span>
      <span>★ 新片上线</span><span>★ 高清画质</span><span>★ 极速播放</span><span>★ 全网搜索</span><span>★ 免费观看</span><span>★ 无广告</span>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">热门 <em>// TOP</em></h2>
      <span class="section-count">08 部影片</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <div class="footer-logo">LeLe<span>TV</span></div>
    <div class="footer-copy">粗野实验设计示范 // BRUTALIST</div>
  </footer>

<script>
  const titles=['星际穿越','盗梦空间','沙丘2','奥本海默','银翼杀手','降临','信条','火星救援'];
  const years=['2024','2023','2024','2023','2024','2023','2024','2023'];
  const tags=['科幻','悬疑','科幻','传记','科幻','科幻','动作','科幻'];
  function card(i){return `<div class="card"><div class="card-poster"><span class="card-num">0${i+1}</span><img src="https://picsum.photos/seed/brut${i}/500/320"></div><div class="card-body"><div class="card-title">${titles[i]}</div><div class="card-meta">${years[i]} // ${tags[i]}</div><span class="card-tag">${tags[i]}</span></div></div>`;}
  let h='';for(let i=0;i<8;i++)h+=card(i);
  document.getElementById('grid').innerHTML=h;
</script>
</body>
</html>
