<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LeLeTV — 观看历史</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<div class="page-wrapper">
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">LeLe<span>TV</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">首页</a>
      <a href="category.html" class="nav-link">分类</a>
      <a href="history.html" class="nav-link active">历史</a>
    </div>
    <div class="nav-actions">
      <a href="search.html" class="nav-icon-btn" title="搜索">🔍</a>
      <a href="settings.html" class="nav-icon-btn" title="设置">⚙</a>
      <a href="about.html" class="nav-avatar">L</a>
    </div>
    <div class="nav-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="nav-link">首页</a>
    <a href="category.html" class="nav-link">分类浏览</a>
    <a href="history.html" class="nav-link active">观看历史</a>
    <a href="search.html" class="nav-link">搜索</a>
    <a href="settings.html" class="nav-link">设置</a>
    <a href="about.html" class="nav-link">关于</a>
  </div>

  <div class="page-content">
    <div class="history-page">
      <div class="history-header">
        <h1 class="text-h1" style="display:flex;align-items:center;gap:12px">
          <span style="width:4px;height:24px;background:var(--primary);border-radius:2px"></span>
          观看历史
        </h1>
        <button class="btn btn-ghost btn-sm">清空历史</button>
      </div>

      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">LeLe<span>TV</span></div>
      <div class="footer-links">
        <a href="about.html">关于我们</a>
        <a href="settings.html">设置</a>
        <a href="#">使用帮助</a>
        <a href="#">隐私政策</a>
      </div>
      <div class="footer-copy">© 2025 LeLeTV · 仅供学习使用</div>
    </div>
  </footer>
</div>

<script>
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
});
function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}
const history = [
  {t:'星际穿越：终极之旅', ep:'第1集', time:'今天 14:32', progress:65, duration:'45:20', thumb:'h0'},
  {t:'庆余年 第二季', ep:'第23集', time:'今天 12:15', progress:100, duration:'42:08', thumb:'h1'},
  {t:'繁花', ep:'第18集', time:'昨天 22:40', progress:30, duration:'48:15', thumb:'h2'},
  {t:'三体', ep:'第8集', time:'昨天 20:05', progress:80, duration:'44:30', thumb:'h3'},
  {t:'狂飙', ep:'第15集', time:'3天前', progress:100, duration:'46:22', thumb:'h4'},
  {t:'灌篮高手 剧场版', ep:'完整版', time:'5天前', progress:100, duration:'124:00', thumb:'h5'},
];
document.getElementById('historyList').innerHTML = history.map(h=>`
  <a href="player.html" class="history-item">
    <div class="history-item-thumb">
      <img src="https://picsum.photos/seed/${h.thumb}/320/180" loading="lazy">
      <div class="history-progress"><div class="history-progress-bar" style="width:${h.progress}%"></div></div>
    </div>
    <div class="history-item-info">
      <div class="history-item-title">${h.t}</div>
      <div class="history-item-meta">${h.ep} · 观看至 ${Math.floor(h.progress*0.45)}:${String(Math.floor(Math.random()*60)).padStart(2,'0')} / ${h.duration}</div>
      <div class="history-item-progress-text">${h.progress === 100 ? '已看完' : '继续观看 ' + h.progress + '%'}</div>
      <div class="history-item-meta" style="margin-top:8px">${h.time}</div>
    </div>
  </a>`).join('');
</script>
</body>
</html>
