<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LeLeTV — 设置</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<div class="page-wrapper">
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">LeLe<span>TV</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">首页</a>
      <a href="category.html" class="nav-link">分类</a>
      <a href="history.html" class="nav-link">历史</a>
    </div>
    <div class="nav-actions">
      <a href="search.html" class="nav-icon-btn" title="搜索">🔍</a>
      <a href="settings.html" class="nav-icon-btn active" title="设置">⚙</a>
      <a href="about.html" class="nav-avatar">L</a>
    </div>
    <div class="nav-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="nav-link">首页</a>
    <a href="category.html" class="nav-link">分类浏览</a>
    <a href="history.html" class="nav-link">观看历史</a>
    <a href="search.html" class="nav-link">搜索</a>
    <a href="settings.html" class="nav-link active">设置</a>
    <a href="about.html" class="nav-link">关于</a>
  </div>

  <div class="page-content">
    <div class="settings-page">
      <h1 class="text-h1 mb-6" style="display:flex;align-items:center;gap:12px">
        <span style="width:4px;height:24px;background:var(--primary);border-radius:2px"></span>
        设置
      </h1>

      <div class="dash-grid">
        <!-- 数据源 -->
        <div class="dash-card dash-card-full">
          <div class="dash-card-header">
            <div class="dash-card-icon">📡</div>
            <h3 class="dash-card-title">数据源</h3>
            <span class="text-xs text-faint">已选 4 / 6</span>
          </div>
          <div class="dash-card-body">
            <div class="dash-actions mb-4">
              <button class="dash-action-btn primary">全选</button>
              <button class="dash-action-btn">全不选</button>
              <button class="dash-action-btn">重置</button>
            </div>
            <div class="api-grid" id="apiGrid"></div>
          </div>
        </div>

        <!-- 自定义API -->
        <div class="dash-card">
          <div class="dash-card-header">
            <div class="dash-card-icon">🔗</div>
            <h3 class="dash-card-title">自定义API</h3>
            <button class="dash-action-btn primary" style="padding:4px 10px;font-size:11px">+ 添加</button>
          </div>
          <div class="dash-card-body">
            <div class="flex flex-col gap-2">
              <div class="api-item">
                <input type="checkbox" checked>
                <span class="api-item-name">我的私有源</span>
              </div>
              <div class="api-item">
                <input type="checkbox">
                <span class="api-item-name">备用测试源</span>
              </div>
            </div>
            <div class="mt-4 p-3" style="background:var(--bg-secondary);border-radius:var(--radius-md)">
              <input class="form-input mb-2" placeholder="API名称" style="font-size:12px;padding:8px 12px">
              <input class="form-input mb-2" placeholder="https://api.example.com/vod" style="font-size:12px;padding:8px 12px">
              <div class="flex gap-2">
                <button class="dash-action-btn primary flex-1">添加</button>
                <button class="dash-action-btn flex-1">取消</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 功能开关 -->
        <div class="dash-card">
          <div class="dash-card-header">
            <div class="dash-card-icon">⚡</div>
            <h3 class="dash-card-title">功能开关</h3>
          </div>
          <div class="dash-card-body">
            <div class="settings-item" style="padding:12px 0;border:none">
              <div class="settings-item-info">
                <div class="settings-item-title">隐藏内容过滤</div>
                <div class="settings-item-desc">过滤敏感分类内容</div>
              </div>
              <div class="settings-item-control">
                <label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label>
              </div>
            </div>
            <div class="settings-item" style="padding:12px 0;border:none">
              <div class="settings-item-info">
                <div class="settings-item-title">分片广告过滤</div>
                <div class="settings-item-desc">自动跳过视频前广告</div>
              </div>
              <div class="settings-item-control">
                <label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label>
              </div>
            </div>
            <div class="settings-item" style="padding:12px 0;border:none">
              <div class="settings-item-info">
                <div class="settings-item-title">硬件解码</div>
                <div class="settings-item-desc">GPU 加速播放</div>
              </div>
              <div class="settings-item-control">
                <label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label>
              </div>
            </div>
            <div class="settings-item" style="padding:12px 0;border:none">
              <div class="settings-item-info">
                <div class="settings-item-title">自动播放下一集</div>
                <div class="settings-item-desc">结束后自动续播</div>
              </div>
              <div class="settings-item-control">
                <label class="switch"><input type="checkbox"><span class="switch-slider"></span></label>
              </div>
            </div>
          </div>
        </div>

        <!-- 一般功能 -->
        <div class="dash-card dash-card-full">
          <div class="dash-card-header">
            <div class="dash-card-icon">📦</div>
            <h3 class="dash-card-title">数据管理</h3>
          </div>
          <div class="dash-card-body">
            <div class="dash-actions">
              <button class="dash-action-btn">📥 导入配置</button>
              <button class="dash-action-btn primary">📤 导出配置</button>
              <button class="dash-action-btn danger">🗑 清除Cookie</button>
              <button class="dash-action-btn danger">清除缓存 (128MB)</button>
            </div>
          </div>
        </div>

        <!-- 播放设置 -->
        <div class="dash-card">
          <div class="dash-card-header">
            <div class="dash-card-icon">▶</div>
            <h3 class="dash-card-title">播放设置</h3>
          </div>
          <div class="dash-card-body">
            <div class="form-group">
              <label class="form-label">默认清晰度</label>
              <select class="form-select">
                <option>1080P 高清</option>
                <option>720P 标清</option>
                <option>480P 流畅</option>
                <option>自动匹配</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">播放速度</label>
              <input type="range" class="range-slider" min="0.5" max="2" step="0.25" value="1">
            </div>
          </div>
        </div>

        <!-- 关于 -->
        <div class="dash-card">
          <div class="dash-card-header">
            <div class="dash-card-icon">ℹ️</div>
            <h3 class="dash-card-title">关于</h3>
          </div>
          <div class="dash-card-body">
            <div class="settings-item" style="padding:8px 0;border:none">
              <div class="settings-item-info">
                <div class="settings-item-title">版本</div>
                <div class="settings-item-desc">LeLeTV v3.4.0</div>
              </div>
              <span class="text-gold text-xs">最新</span>
            </div>
            <div class="settings-item" onclick="location.href='about.html'" style="padding:8px 0;border:none;cursor:pointer">
              <div class="settings-item-info">
                <div class="settings-item-title">关于 LeLeTV</div>
              </div>
              <span class="text-faint">→</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">LeLe<span>TV</span></div>
      <div class="footer-links">
        <a href="about.html">关于我们</a>
        <a href="settings.html">设置</a>
        <a href="#">使用帮助</a>
        <a href="#">隐私政策</a>
      </div>
      <div class="footer-copy">© 2025 LeLeTV · 仅供学习使用</div>
    </div>
  </footer>
</div>

<script>
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
});
function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}
const apis = [
  {name:'资源站A', checked:true},
  {name:'资源站B', checked:true},
  {name:'资源站C', checked:true},
  {name:'资源站D', checked:false},
  {name:'资源站E', checked:true},
  {name:'资源站F', checked:false},
];
document.getElementById('apiGrid').innerHTML = apis.map(a=>`
  <div class="api-item">
    <input type="checkbox" ${a.checked?'checked':''}>
    <span class="api-item-name">${a.name}</span>
  </div>`).join('');
</script>
</body>
</html>
