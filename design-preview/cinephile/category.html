<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LeLeTV — 分类浏览</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<div class="page-wrapper">
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">LeLe<span>TV</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">首页</a>
      <a href="category.html" class="nav-link active">分类</a>
      <a href="history.html" class="nav-link">历史</a>
    </div>
    <div class="nav-actions">
      <a href="search.html" class="nav-icon-btn" title="搜索">🔍</a>
      <a href="settings.html" class="nav-icon-btn" title="设置">⚙</a>
      <a href="about.html" class="nav-avatar">L</a>
    </div>
    <div class="nav-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="nav-link">首页</a>
    <a href="category.html" class="nav-link active">分类浏览</a>
    <a href="history.html" class="nav-link">观看历史</a>
    <a href="search.html" class="nav-link">搜索</a>
    <a href="settings.html" class="nav-link">设置</a>
    <a href="about.html" class="nav-link">关于</a>
  </div>

  <div class="page-content">
    <!-- 筛选器 -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-group-label">类型</span>
        <span class="filter-option active">全部</span>
        <span class="filter-option">动作</span>
        <span class="filter-option">喜剧</span>
        <span class="filter-option">爱情</span>
        <span class="filter-option">科幻</span>
        <span class="filter-option">悬疑</span>
        <span class="filter-option">恐怖</span>
        <span class="filter-option">剧情</span>
        <span class="filter-option">动画</span>
      </div>
    </div>
    <div class="filter-bar" style="border-bottom:none;padding-top:0">
      <div class="filter-group">
        <span class="filter-group-label">年份</span>
        <span class="filter-option active">全部</span>
        <span class="filter-option">2024</span>
        <span class="filter-option">2023</span>
        <span class="filter-option">2022</span>
        <span class="filter-option">2020-2021</span>
        <span class="filter-option">更早</span>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">地区</span>
        <span class="filter-option active">全部</span>
        <span class="filter-option">大陆</span>
        <span class="filter-option">港台</span>
        <span class="filter-option">欧美</span>
        <span class="filter-option">日韩</span>
        <span class="filter-option">其他</span>
      </div>
      <div class="filter-group">
        <span class="filter-group-label">排序</span>
        <span class="filter-option active">热门</span>
        <span class="filter-option">最新</span>
        <span class="filter-option">评分</span>
      </div>
    </div>

    <!-- 结果 -->
    <section class="section" style="padding-top:var(--space-4)">
      <div class="section-header">
        <h2 class="section-title">全部影片</h2>
        <span class="section-more">共 128 部</span>
      </div>
      <div class="card-grid" id="categoryGrid"></div>

      <!-- 分页 -->
      <div class="flex justify-center items-center gap-2 mt-8">
        <button class="btn btn-secondary btn-sm">← 上一页</button>
        <button class="btn btn-primary btn-sm" style="min-width:36px">1</button>
        <button class="btn btn-ghost btn-sm" style="min-width:36px">2</button>
        <button class="btn btn-ghost btn-sm" style="min-width:36px">3</button>
        <span class="text-faint text-sm">...</span>
        <button class="btn btn-ghost btn-sm" style="min-width:36px">12</button>
        <button class="btn btn-secondary btn-sm">下一页 →</button>
      </div>
    </section>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">LeLe<span>TV</span></div>
      <div class="footer-links">
        <a href="about.html">关于我们</a>
        <a href="settings.html">设置</a>
        <a href="#">使用帮助</a>
        <a href="#">隐私政策</a>
      </div>
      <div class="footer-copy">© 2025 LeLeTV · 仅供学习使用</div>
    </div>
  </footer>
</div>

<script>
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
});
function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}
const cats = [
  {t:'星际穿越', y:'2024', g:'科幻', r:'9.4'},
  {t:'盗梦空间', y:'2023', g:'悬疑', r:'9.3'},
  {t:'沙丘2', y:'2024', g:'科幻', r:'8.9'},
  {t:'奥本海默', y:'2023', g:'传记', r:'8.8'},
  {t:'银翼杀手2049', y:'2024', g:'科幻', r:'9.1'},
  {t:'降临', y:'2023', g:'科幻', r:'8.7'},
  {t:'信条', y:'2024', g:'动作', r:'8.6'},
  {t:'星际迷航', y:'2023', g:'科幻', r:'8.5'},
  {t:'火星救援', y:'2024', g:'科幻', r:'8.8'},
  {t:'地心引力', y:'2023', g:'惊悚', r:'8.4'},
  {t:'银河护卫队3', y:'2024', g:'动作', r:'8.9'},
  {t:'黑豹2', y:'2023', g:'动作', r:'8.3'},
];
document.getElementById('categoryGrid').innerHTML = cats.map((d,i)=>`
  <a href="player.html" class="card">
    <div class="card-poster">
      <span class="card-badge">★ ${d.r}</span>
      <img src="https://picsum.photos/seed/cat${i}/300/450" loading="lazy">
      <div class="card-play"></div>
    </div>
    <div class="card-info">
      <div class="card-title">${d.t}</div>
      <div class="card-meta"><span>${d.y}</span><span class="dot"></span><span>${d.g}</span></div>
    </div>
  </a>`).join('');
</script>
</body>
</html>
