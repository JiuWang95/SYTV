<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LeLeTV — 搜索结果</title>
<link rel="stylesheet" href="design-system.css">
</head>
<body>
<div class="page-wrapper">
  <nav class="navbar" id="navbar">
    <a href="index.html" class="nav-logo">LeLe<span>TV</span></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">首页</a>
      <a href="category.html" class="nav-link">分类</a>
      <a href="history.html" class="nav-link">历史</a>
    </div>
    <div class="nav-actions">
      <a href="search.html" class="nav-icon-btn active" title="搜索">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
      </a>
      <a href="settings.html" class="nav-icon-btn" title="设置">⚙</a>
      <a href="about.html" class="nav-avatar">L</a>
    </div>
    <div class="nav-toggle" onclick="toggleMenu()"><span></span><span></span><span></span></div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="nav-link">首页</a>
    <a href="category.html" class="nav-link">分类浏览</a>
    <a href="history.html" class="nav-link">观看历史</a>
    <a href="search.html" class="nav-link active">搜索</a>
    <a href="settings.html" class="nav-link">设置</a>
    <a href="about.html" class="nav-link">关于</a>
  </div>

  <div class="page-content">
    <div class="movies-layout">
      <!-- 左侧：影片源筛选 -->
      <aside class="movies-sidebar">
        <div class="movies-sidebar-title">影片源</div>
        <div id="sourceList"></div>
      </aside>

      <!-- 右侧：结果网格 -->
      <main class="movies-main">
        <div class="movies-topbar">
          <h1>搜索 "星际"</h1>
          <span class="movies-count">共 48 个结果 · 6 个源</span>
        </div>

        <!-- 筛选标签 -->
        <div class="tags mb-6">
          <span class="tag active">全部</span>
          <span class="tag">电影</span>
          <span class="tag">剧集</span>
          <span class="tag">动漫</span>
          <span class="tag">综艺</span>
        </div>

        <div class="card-grid" id="resultsGrid"></div>
      </main>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">LeLe<span>TV</span></div>
      <div class="footer-links">
        <a href="about.html">关于我们</a>
        <a href="settings.html">设置</a>
        <a href="#">使用帮助</a>
        <a href="#">隐私政策</a>
      </div>
      <div class="footer-copy">© 2025 LeLeTV · 仅供学习使用</div>
    </div>
  </footer>
</div>

<script>
window.addEventListener('scroll', () => {
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 20);
});
function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}
// 影片源
const sources = [
  {name:'资源站A', count:12, online:true},
  {name:'资源站B', count:8, online:true},
  {name:'资源站C', count:10, online:true},
  {name:'资源站D', count:6, online:false},
  {name:'资源站E', count:9, online:true},
  {name:'自定义源', count:3, online:true},
];
document.getElementById('sourceList').innerHTML = sources.map((s,i)=>`
  <div class="source-item ${i===0?'active':''}">
    <span class="source-item-dot ${s.online?'':'offline'}"></span>
    <span class="source-item-name">${s.name}</span>
    <span class="source-item-count">${s.count}</span>
  </div>`).join('');
// 结果
const results = [
  {t:'星际穿越', y:'2024', g:'科幻', r:'9.4'},
  {t:'星际迷航', y:'2023', g:'科幻', r:'8.5'},
  {t:'星际迷航2', y:'2022', g:'科幻', r:'8.2'},
  {t:'星际传奇', y:'2021', g:'动作', r:'7.8'},
  {t:'星际之门', y:'2020', g:'科幻', r:'8.0'},
  {t:'星际公敌', y:'2019', g:'惊悚', r:'7.5'},
  {t:'星际奇兵', y:'2018', g:'动作', r:'7.2'},
  {t:'星际觉醒', y:'2024', g:'科幻', r:'8.1'},
  {t:'星际漫游', y:'2023', g:'动画', r:'8.6'},
  {t:'星际猎人', y:'2022', g:'动作', r:'7.9'},
  {t:'星际战争', y:'2021', g:'科幻', r:'8.3'},
  {t:'星际逃亡', y:'2020', g:'惊悚', r:'7.6'},
];
document.getElementById('resultsGrid').innerHTML = results.map((d,i)=>`
  <a href="player.html" class="card">
    <div class="card-poster">
      <span class="card-badge">★ ${d.r}</span>
      <img src="https://picsum.photos/seed/mv${i}/300/450" loading="lazy">
      <div class="card-play"></div>
    </div>
    <div class="card-info">
      <div class="card-title">${d.t}</div>
      <div class="card-meta"><span>${d.y}</span><span class="dot"></span><span>${d.g}</span></div>
    </div>
  </a>`).join('');
</script>
</body>
</html>
