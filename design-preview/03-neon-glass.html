<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeLeTV — 霓虹玻璃</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0f;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* 背景光晕 */
  body::before {
    content: ''; position: fixed; top: -20%; left: -10%;
    width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: ''; position: fixed; bottom: -20%; right: -10%;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  /* 导航 — 毛玻璃 */
  nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 48px;
    background: rgba(10,10,15,0.6);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(236,72,153,0.1);
  }
  .logo { font-size: 22px; font-weight: 800; }
  .logo span {
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    color: #999; text-decoration: none; font-size: 14px; font-weight: 500;
    padding: 8px 16px; border-radius: 999px; transition: all .3s;
  }
  .nav-links a:hover { color: #fff; background: rgba(255,255,255,0.06); }
  .nav-links a.active {
    color: #fff;
    background: linear-gradient(135deg, rgba(236,72,153,0.2), rgba(139,92,246,0.2));
    border: 1px solid rgba(236,72,153,0.3);
  }
  .search-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(236,72,153,0.2);
    border-radius: 999px;
    padding: 10px 20px;
    width: 260px; color: #fff; font-size: 14px;
    outline: none; transition: all .3s;
    backdrop-filter: blur(10px);
  }
  .search-box:focus {
    border-color: #ec4899;
    box-shadow: 0 0 20px rgba(236,72,153,0.2), 0 0 40px rgba(236,72,153,0.1);
    background: rgba(255,255,255,0.08);
  }
  .search-box::placeholder { color: #555; }

  /* Hero */
  .hero {
    position: relative; z-index: 1;
    margin: 32px 48px;
    border-radius: 24px;
    overflow: hidden;
    height: 400px;
    border: 1px solid rgba(236,72,153,0.15);
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: url('https://picsum.photos/seed/neon-hero/1400/500') center/cover;
    filter: saturate(1.2);
  }
  .hero-glow {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(236,72,153,0.3) 0%, rgba(139,92,246,0.2) 50%, rgba(10,10,15,0.9) 100%);
  }
  .hero-content {
    position: relative; z-index: 2;
    padding: 56px; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    max-width: 540px;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(236,72,153,0.15);
    border: 1px solid rgba(236,72,153,0.3);
    backdrop-filter: blur(10px);
    color: #f472b6; font-size: 12px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px;
    width: fit-content; margin-bottom: 20px;
  }
  .hero-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ec4899; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .hero-title {
    font-size: 42px; font-weight: 800; line-height: 1.1;
    letter-spacing: -1px; margin-bottom: 14px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .hero-desc { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.7; margin-bottom: 24px; }
  .hero-btns { display: flex; gap: 12px; }
  .btn-glow {
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    color: #fff; border: none; border-radius: 999px;
    padding: 14px 30px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .3s;
    box-shadow: 0 4px 20px rgba(236,72,153,0.4);
  }
  .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 8px 35px rgba(236,72,153,0.5); }
  .btn-glass {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    color: #fff; border-radius: 999px;
    padding: 14px 26px; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all .3s;
  }
  .btn-glass:hover { background: rgba(255,255,255,0.14); }

  /* 区块 */
  .section { position: relative; z-index: 1; padding: 36px 48px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .section-title {
    font-size: 20px; font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::before {
    content: ''; width: 4px; height: 20px; border-radius: 2px;
    background: linear-gradient(180deg, #ec4899, #8b5cf6);
  }
  .section-more { color: #888; font-size: 13px; cursor: pointer; }
  .section-more:hover { color: #ec4899; }

  /* 卡片 — 玻璃拟态 */
  .grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 18px; }
  .card { cursor: pointer; transition: transform .35s cubic-bezier(0.16,1,0.3,1); }
  .card:hover { transform: translateY(-5px); }
  .card-poster {
    position: relative; aspect-ratio: 2/3;
    border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    transition: all .35s;
  }
  .card:hover .card-poster {
    border-color: rgba(236,72,153,0.4);
    box-shadow: 0 8px 32px rgba(236,72,153,0.2), 0 0 0 1px rgba(236,72,153,0.2);
  }
  .card-poster img { width:100%; height:100%; object-fit:cover; transition: transform .5s; }
  .card:hover .card-poster img { transform: scale(1.05); }
  .card-poster::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, transparent 40%, rgba(10,10,15,0.9) 100%);
  }
  .card-rating {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    background: rgba(236,72,153,0.85);
    backdrop-filter: blur(8px);
    color: #fff; font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .card-play {
    position: absolute; bottom: 14px; right: 14px; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(236,72,153,0.9);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.8); transition: all .35s;
    box-shadow: 0 4px 16px rgba(236,72,153,0.4);
  }
  .card:hover .card-play { opacity:1; transform: scale(1); }
  .card-play::before { content:'▶'; color:#fff; font-size:12px; margin-left:2px; }
  .card-info { padding: 12px 4px 0; }
  .card-title { font-size: 14px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition: color .3s; }
  .card:hover .card-title { color: #f472b6; }
  .card-meta { font-size: 12px; color: #666; margin-top: 3px; }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 40px;
    color: #444; font-size: 13px;
    border-top: 1px solid rgba(236,72,153,0.08);
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">LeLe<span>TV</span></div>
    <div class="nav-links">
      <a href="#" class="active">首页</a>
      <a href="#">电影</a>
      <a href="#">剧集</a>
      <a href="#">动漫</a>
      <a href="#">综艺</a>
    </div>
    <input class="search-box" placeholder="🔍 搜索影片...">
  </nav>

  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-glow"></div>
    <div class="hero-content">
      <span class="hero-badge">正在热播</span>
      <h1 class="hero-title">赛博朋克：边缘行者</h1>
      <p class="hero-desc">在霓虹闪烁的未来都市，一个街头少年踏上了成为赛博朋克的危险旅程。扳机社出品的年度神作。</p>
      <div class="hero-btns">
        <button class="btn-glow">▶ 立即播放</button>
        <button class="btn-glass">+ 收藏</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">热门推荐</h2>
      <span class="section-more">全部 →</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">新番上线</h2>
      <span class="section-more">全部 →</span>
    </div>
    <div class="grid" id="grid2"></div>
  </div>

  <footer>LeLeTV · 霓虹玻璃设计示范</footer>

<script>
  const titles=['赛博朋克','星际穿越','盗梦空间','沙丘2','银翼杀手','攻壳机动队','信条','星际迷航','火星救援','阿丽塔','银河护卫队','黑客帝国'];
  const years=['2024','2023','2024','2023','2024','2023','2024','2023','2024','2023','2024','2023'];
  const ratings=['9.2','9.4','9.3','8.9','9.1','8.8','8.6','8.5','8.8','8.4','8.9','9.0'];
  function card(i,seed){return `<div class="card"><div class="card-poster"><span class="card-rating">★ ${ratings[i]}</span><img src="https://picsum.photos/seed/${seed}/300/450"><div class="card-play"></div></div><div class="card-info"><div class="card-title">${titles[i]}</div><div class="card-meta">${years[i]} · 科幻</div></div></div>`;}
  let a='',b='';for(let i=0;i<6;i++)a+=card(i,'ng'+i);for(let i=6;i<12;i++)b+=card(i,'ng'+i);
  document.getElementById('grid').innerHTML=a;document.getElementById('grid2').innerHTML=b;
</script>
</body>
</html>
