<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeLeTV — 极简克制</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* 导航 */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 48px;
  }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: #ec4899; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { color: #666; text-decoration: none; font-size: 14px; font-weight: 500; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: #fff; }
  .search-wrap { position: relative; }
  .search-box {
    background: transparent;
    border: none; border-bottom: 1px solid #333;
    padding: 8px 0;
    width: 220px;
    color: #fff; font-size: 14px;
    outline: none; transition: border-color .3s;
  }
  .search-box:focus { border-color: #ec4899; }
  .search-box::placeholder { color: #444; }

  /* Hero — 极简文字 */
  .hero {
    padding: 80px 48px 60px;
    max-width: 700px;
  }
  .hero-label {
    font-size: 12px; color: #ec4899; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 20px;
  }
  .hero-title {
    font-size: 52px; font-weight: 700; line-height: 1.05;
    letter-spacing: -1.5px; margin-bottom: 20px;
  }
  .hero-desc {
    font-size: 16px; color: #888; line-height: 1.7;
    max-width: 480px; margin-bottom: 32px;
  }
  .play-link {
    display: inline-flex; align-items: center; gap: 10px;
    color: #fff; font-size: 15px; font-weight: 600;
    text-decoration: none; cursor: pointer;
    padding-bottom: 4px; border-bottom: 2px solid #ec4899;
    transition: gap .3s;
  }
  .play-link:hover { gap: 16px; }

  /* 区块 */
  .section { padding: 32px 48px; }
  .section-title {
    font-size: 15px; font-weight: 600; color: #888;
    margin-bottom: 20px; letter-spacing: 0.3px;
  }

  /* 卡片 — 极致简洁 */
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 24px;
  }
  .card { cursor: pointer; }
  .card-poster {
    position: relative;
    aspect-ratio: 2/3;
    border-radius: 6px;
    overflow: hidden;
    background: #111;
  }
  .card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s;
  }
  .card:hover .card-overlay { opacity: 1; }
  .card-overlay .play-icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: #ec4899;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .card-overlay .play-icon::before { content: '▶'; color: #fff; font-size: 16px; margin-left: 2px; }
  .card-overlay .card-rating { color: #fff; font-size: 14px; font-weight: 600; }
  .card-info { padding-top: 10px; }
  .card-title {
    font-size: 13px; font-weight: 500; color: #ccc;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .2s;
  }
  .card:hover .card-title { color: #fff; }
  .card-year { font-size: 12px; color: #555; margin-top: 2px; }

  footer {
    text-align: center; padding: 48px;
    color: #333; font-size: 12px;
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">LeLe<span>TV</span></div>
    <div class="nav-links">
      <a href="#" class="active">首页</a>
      <a href="#">电影</a>
      <a href="#">剧集</a>
      <a href="#">动漫</a>
    </div>
    <div class="search-wrap">
      <input class="search-box" placeholder="搜索...">
    </div>
  </nav>

  <div class="hero">
    <div class="hero-label">精选推荐</div>
    <h1 class="hero-title">发现好片<br>仅此而已</h1>
    <p class="hero-desc">没有花哨的界面，没有多余的推荐。你想看的，就在这里。</p>
    <a class="play-link">开始浏览 →</a>
  </div>

  <div class="section">
    <h2 class="section-title">热门</h2>
    <div class="grid" id="grid"></div>
  </div>

  <div class="section">
    <h2 class="section-title">最新</h2>
    <div class="grid" id="grid2"></div>
  </div>

  <footer>LeLeTV · 极简克制设计示范</footer>

<script>
  const titles = ['星际穿越','盗梦空间','沙丘2','奥本海默','银翼杀手','降临','信条','星际迷航','火星救援','地心引力','银河护卫队','黑豹'];
  const years = ['2024','2023','2024','2023','2024','2023','2024','2023','2024','2023','2024','2023'];
  const ratings = ['9.4','9.3','8.9','8.8','9.1','8.7','8.6','8.5','8.8','8.4','8.9','8.3'];
  function makeCard(i, seed) {
    return `<div class="card">
      <div class="card-poster">
        <img src="https://picsum.photos/seed/${seed}/300/450" alt="${titles[i]}">
        <div class="card-overlay">
          <div class="play-icon"></div>
          <div class="card-rating">★ ${ratings[i]}</div>
        </div>
      </div>
      <div class="card-info">
        <div class="card-title">${titles[i]}</div>
        <div class="card-year">${years[i]}</div>
      </div>
    </div>`;
  }
  let h1='',h2='';
  for(let i=0;i<6;i++) h1+=makeCard(i,'min'+i);
  for(let i=6;i<12;i++) h2+=makeCard(i,'min'+i);
  document.getElementById('grid').innerHTML=h1;
  document.getElementById('grid2').innerHTML=h2;
</script>
</body>
</html>
