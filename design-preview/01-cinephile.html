<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeLeTV — 高端影院感</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(180deg, #0a0a0f 0%, #12121a 50%, #0d0d14 100%);
    color: #f5f0e8;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* 导航 */
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 48px;
    border-bottom: 1px solid rgba(201,169,110,0.08);
  }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: #f5f0e8; }
  .logo span { color: #c9a96e; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a { color: #8a8680; text-decoration: none; font-size: 14px; font-weight: 500; transition: color .3s; }
  .nav-links a:hover, .nav-links a.active { color: #f5f0e8; }
  .search-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,169,110,0.15);
    border-radius: 999px;
    padding: 10px 20px;
    width: 280px;
    color: #f5f0e8;
    font-size: 14px;
    outline: none;
    transition: all .3s;
  }
  .search-box:focus { border-color: #c9a96e; background: rgba(255,255,255,0.06); }
  .search-box::placeholder { color: #5a5650; }

  /* Hero */
  .hero {
    position: relative;
    margin: 32px 48px;
    border-radius: 20px;
    overflow: hidden;
    height: 420px;
    background: linear-gradient(135deg, #1a1520 0%, #0d0d14 100%);
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: url('https://picsum.photos/seed/cine-hero/1400/500') center/cover;
    opacity: 0.35;
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.5) 50%, transparent 100%);
  }
  .hero-content {
    position: relative; z-index: 2;
    padding: 60px 56px;
    max-width: 560px;
    height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .hero-tag {
    display: inline-block;
    color: #c9a96e; font-size: 12px; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 16px;
  }
  .hero-title {
    font-size: 44px; font-weight: 800; line-height: 1.1;
    letter-spacing: -1px; margin-bottom: 16px;
  }
  .hero-desc {
    font-size: 15px; color: #a09c96; line-height: 1.7;
    margin-bottom: 28px;
  }
  .hero-btns { display: flex; gap: 14px; }
  .btn-primary {
    background: #c9a96e; color: #0a0a0f;
    border: none; border-radius: 999px;
    padding: 14px 32px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .3s;
  }
  .btn-primary:hover { background: #d4b87a; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(201,169,110,0.3); }
  .btn-secondary {
    background: rgba(255,255,255,0.06); color: #f5f0e8;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 14px 28px; font-size: 15px; font-weight: 500;
    cursor: pointer; transition: all .3s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }

  /* 区块标题 */
  .section { padding: 40px 48px; }
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
  }
  .section-title::before {
    content: ''; display: inline-block;
    width: 3px; height: 18px; background: #c9a96e;
    margin-right: 12px; vertical-align: middle; border-radius: 2px;
  }
  .section-more { color: #8a8680; font-size: 13px; cursor: pointer; transition: color .3s; }
  .section-more:hover { color: #c9a96e; }

  /* 卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 20px;
  }
  .card {
    cursor: pointer; transition: transform .4s cubic-bezier(0.16,1,0.3,1);
  }
  .card:hover { transform: translateY(-6px); }
  .card-poster {
    position: relative;
    aspect-ratio: 2/3;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a24;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: box-shadow .4s;
  }
  .card:hover .card-poster { box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(201,169,110,0.2); }
  .card-poster img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(0.16,1,0.3,1); }
  .card:hover .card-poster img { transform: scale(1.06); }
  .card-poster::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.7) 100%);
    opacity: 0; transition: opacity .4s;
  }
  .card:hover .card-poster::after { opacity: 1; }
  .card-rating {
    position: absolute; top: 10px; right: 10px;
    background: rgba(201,169,110,0.9); color: #0a0a0f;
    font-size: 12px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px;
    z-index: 2;
  }
  .card-play {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%) scale(0.8);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(201,169,110,0.95);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all .4s; z-index: 2;
  }
  .card:hover .card-play { opacity: 1; transform: translateX(-50%) scale(1); }
  .card-play::before { content: '▶'; color: #0a0a0f; font-size: 14px; margin-left: 2px; }
  .card-info { padding: 12px 4px 0; }
  .card-title {
    font-size: 14px; font-weight: 600; color: #e8e4de;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .3s;
  }
  .card:hover .card-title { color: #c9a96e; }
  .card-meta { font-size: 12px; color: #6a6660; margin-top: 4px; }

  footer {
    text-align: center; padding: 40px;
    color: #4a4640; font-size: 13px;
    border-top: 1px solid rgba(201,169,110,0.06);
    margin-top: 40px;
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">LeLe<span>TV</span></div>
    <div class="nav-links">
      <a href="#" class="active">首页</a>
      <a href="#">电影</a>
      <a href="#">剧集</a>
      <a href="#">动漫</a>
      <a href="#">综艺</a>
    </div>
    <input class="search-box" placeholder="搜索影片...">
  </nav>

  <div class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="hero-tag">本周精选</span>
      <h1 class="hero-title">星际穿越：终极之旅</h1>
      <p class="hero-desc">一支探险队穿越虫洞，为人类寻找新的家园。诺兰执导的科幻史诗巨作，震撼视效与深邃情感的完美结合。</p>
      <div class="hero-btns">
        <button class="btn-primary">▶ 立即播放</button>
        <button class="btn-secondary">+ 加入收藏</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">热门推荐</h2>
      <span class="section-more">查看全部 →</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 class="section-title">最新上线</h2>
      <span class="section-more">查看全部 →</span>
    </div>
    <div class="grid" id="grid2"></div>
  </div>

  <footer>LeLeTV · 高端影院感设计示范 · 仅供风格参考</footer>

<script>
  const titles = ['星际穿越','盗梦空间','沙丘2','奥本海默','银翼杀手2049','降临','信条','星际迷航','火星救援','地心引力','银河护卫队3','黑豹2'];
  const years = ['2024','2023','2024','2023','2024','2023','2024','2023','2024','2023','2024','2023'];
  const ratings = ['9.4','9.3','8.9','8.8','9.1','8.7','8.6','8.5','8.8','8.4','8.9','8.3'];
  function makeCard(i, seed) {
    return `<div class="card">
      <div class="card-poster">
        <span class="card-rating">${ratings[i]}</span>
        <img src="https://picsum.photos/seed/${seed}/300/450" alt="${titles[i]}">
        <div class="card-play"></div>
      </div>
      <div class="card-info">
        <div class="card-title">${titles[i]}</div>
        <div class="card-meta">${years[i]} · 科幻</div>
      </div>
    </div>`;
  }
  let html1 = '', html2 = '';
  for(let i=0;i<6;i++) html1 += makeCard(i, 'cine'+i);
  for(let i=6;i<12;i++) html2 += makeCard(i, 'cine'+i);
  document.getElementById('grid').innerHTML = html1;
  document.getElementById('grid2').innerHTML = html2;
</script>
</body>
</html>
