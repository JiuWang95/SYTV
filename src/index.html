<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 源文件：根 index.html 由 scripts/build-bundles.mjs 从本文件装配生成，请勿直接编辑根文件。 -->
    <!-- 首帧即黑：必须紧跟 charset，早于一切外部资源与脚本。
         PWA 从桌面/主屏图标冷启动时，浏览器在拉到样式表之前有一个"默认白底"窗口，
         这段内联样式让第一次绘制就是黑底，杜绝白屏闪烁。 -->
    <meta name="theme-color" content="#0A0A0B">
    <style>
        html, body { background: #0A0A0B !important; margin: 0; padding: 0; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>LeLeTV</title>
    <meta name="description" content="LeLeTV：多源影视检索与播放。">
    <meta name="keywords" content="在线视频,视频搜索,电影,电视剧,LeLeTV">
    <meta name="author" content="LeLeTV Team">

    <!-- Favicon -->
    <link rel="icon" href="/image/brand/leletv-favicon.svg?v=le6" type="image/svg+xml">
    <link rel="icon" href="/image/brand/favicon-32.png?v=le6" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="/image/brand/apple-touch-icon-180.png?v=le6">
    <link rel="manifest" href="/manifest.json">

    <!-- 正文只预取 Regular 一个字重（40KB）。
         Bold 首屏几乎只用在中文标题上（中文本来就走系统字体），预取它等于让 40KB 和 JS bundle
         抢跨境带宽；需要时 @font-face 自己的 font-display: swap 会补上，不阻塞首屏文字。
         海报不再直连 image.tmdb.org（改走 Worker 的 /img 代理），所以这里也不为它预连；
         Worker 域名的 preconnect 在文件末尾的环境变量脚本里按需创建。 -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/libs/geist/Geist-Regular.woff2?v=v3.4.0">
    <!-- 播放页 bundle 的文件名（打包脚本会更新），结果页出来后用它预取播放页资源 -->
    <meta name="leletv-player-bundle" content="dist/leletv-player.x9s0wg.js">
    <!-- 非首页页面的按需 bundle（构建脚本会更新文件名） -->
    <meta name="leletv-page-bundles" content='{"category":"dist/leletv-category.idfvkn.js","settings":"dist/leletv-settings.ssg4lw.js"}'>

    <!-- PWA：添加到主屏/桌面后以独立窗口运行（无浏览器 UI） -->
    <!-- mobile-web-app-capable 为标准化写法（Chrome 已废弃 apple-* 前缀）；apple-* 保留以兼容 iOS Safari -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- iOS 主屏启动帧：这里刻意不提供 apple-touch-startup-image。
         系统帧只使用 manifest 的 background_color（#0A0A0B），与站内 #bootSplash 首帧同色；
         网页一旦到达就直接接管成「玻璃五角星 → LeLeTV」入场，避免静态启动图与动画之间跳变。
         旧机型若回退为系统默认色，也只会与启动层基底相差一帧。 -->

    <!-- 样式：变量与背景 → 通用组件 → 首页。
         views.css（内页）与 admin.css（设置页面板）改由 js/app/page-loader.js
         在首次进入对应页面时加载，不再占用首屏。 -->
    <link rel="stylesheet" href="/src/styles/variables.css?v=v4.2.6">
    <link rel="stylesheet" href="/src/styles/base.css?v=v4.2.6">
    <link rel="stylesheet" href="/src/pages/home/style.css?v=v4.2.6">

    <!-- 首屏脚本预载，放在 head 而不是 body 末尾：
         <script type="module"> 要等解析到 body 末尾才开始下载，跨境线路单程 150~250ms，
         等于把整个 bundle 的下载推后一整段 HTML 解析时间。这里提前声明 modulepreload，
         让 JS 与 HTML/CSS 并行下载；执行位置仍由 body 末尾的 <script type="module"> 决定，行为不变。 -->
    <!-- #bundle-preload -->

    <!-- Geist 字体：本地自托管（原先走 cdn.jsdelivr.net，跨境抖动会拖慢首屏；libs/* 命中长缓存） -->
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-Regular.woff2?v=v3.4.0') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-Medium.woff2?v=v3.4.0') format('woff2');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-SemiBold.woff2?v=v3.4.0') format('woff2');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-Bold.woff2?v=v3.4.0') format('woff2');
            font-weight: 700;
            font-display: swap;
        }
    </style>

    <!-- 主题：私密模式标记 + 已保存的主题色，均在首帧之前落到 <html> 上
     · 私密模式：src/styles/variables.css 的 html[data-hidden-mode] 据此把默认色切成铜色
     · 自定义主题色：把派生色写进行内样式（优先级高于上面的样式表规则），
       避免先闪默认色再切到目标色；算法与 js/ui/theme-system.js 一致，改动需同步 -->
<script>
    (function () {
        var d = document.documentElement;
        try {
            if (localStorage.getItem('hiddenContentMode') === 'true') {
                d.setAttribute('data-hidden-mode', '1');
            }
        } catch (e) { /* localStorage 不可用时按正常模式渲染 */ }
        try {
            // 动态效果偏好：设置里强制开启 / 关闭时打到 <html> 上，css 与脚本据此放行或停掉动画
            // 地址带 ?motion=on / off / auto 时先按它记下来（排查时一次性强制开启用）
            var motionParam = new URLSearchParams(location.search).get('motion');
            if (motionParam === 'on' || motionParam === 'off') localStorage.setItem('leletv_motion', motionParam);
            else if (motionParam === 'auto') localStorage.removeItem('leletv_motion');
            var motion = localStorage.getItem('leletv_motion');
            if (motion === 'on' || motion === 'off') d.setAttribute('data-motion', motion);
        } catch (e) { /* 忽略 */ }
        try {
            // 首页与导航布局偏好（设置 › 首页与导航）：首帧就按它隐藏聚合动效 / 内容板块、导航只留图标
            // 按数据域取键（同 leletv_theme_normal / leletv_theme_hidden 的惯例）；
            // 私密模式下 hub / shelves 默认关闭，用户在设置里手动打开才会写 true
            var hiddenLayout = d.hasAttribute('data-hidden-mode');
            var layout = JSON.parse(localStorage.getItem(hiddenLayout ? 'leletv_layout_hidden' : 'leletv_layout') || '{}') || {};
            if (layout.hub === false || (hiddenLayout && layout.hub !== true)) d.setAttribute('data-home-hub', 'off');
            if (layout.shelves === false || (hiddenLayout && layout.shelves !== true)) d.setAttribute('data-home-shelves', 'off');
            if (layout.navIcons === true) d.setAttribute('data-nav', 'icons');
        } catch (e) { /* 忽略 */ }

        try {
            // 按数据域取已保存的主题（两个模式各存一套；没存过就保持 css 默认色）
            var raw = localStorage.getItem(d.hasAttribute('data-hidden-mode') ? 'leletv_theme_hidden' : 'leletv_theme_normal');
            if (!raw) return;
            var m = /^#?([0-9a-f]{6})$/i.exec(String((JSON.parse(raw) || {}).hex || ''));
            if (!m) return;
            var hx = m[1];
            var R = parseInt(hx.slice(0, 2), 16) / 255;
            var G = parseInt(hx.slice(2, 4), 16) / 255;
            var B = parseInt(hx.slice(4, 6), 16) / 255;
            var mx = Math.max(R, G, B), mn = Math.min(R, G, B), L = (mx + mn) / 2, D = mx - mn;
            var H = 0, S = 0;
            if (D > 1e-6) {
                S = L > 0.5 ? D / (2 - mx - mn) : D / (mx + mn);
                H = mx === R ? 60 * (((G - B) / D) % 6) : (mx === G ? 60 * ((B - R) / D + 2) : 60 * ((R - G) / D + 4));
                if (H < 0) H += 360;
            }
            S *= 100;
            var STOPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
            var LS = [96, 93, 87, 80, 70, 60, 51, 43, 35, 26];
            // 无彩色（灰色系）另铺满黑→白，与 js/ui/theme-system.js 的 RAMP_L_MONO 一致
            if (S < 5) LS = [100, 89, 78, 67, 56, 44, 33, 22, 11, 0];
            // 只调明度、保留色相与饱和度：无彩色主色自然得到灰阶
            function shade(l) {
                var c = (1 - Math.abs(2 * l / 100 - 1)) * (S / 100);
                var x = c * (1 - Math.abs(((H / 60) % 2) - 1));
                var mm = l / 100 - c / 2, r = 0, g = 0, b = 0;
                if (H < 60) { r = c; g = x; } else if (H < 120) { r = x; g = c; }
                else if (H < 180) { g = c; b = x; } else if (H < 240) { g = x; b = c; }
                else if (H < 300) { r = x; b = c; } else { r = c; b = x; }
                function f(v) { return ('0' + Math.round((v + mm) * 255).toString(16)).slice(-2); }
                return {
                    hex: '#' + f(r) + f(g) + f(b),
                    rgb: [Math.round((r + mm) * 255), Math.round((g + mm) * 255), Math.round((b + mm) * 255)]
                };
            }
            var st = d.style;
            st.setProperty('--color-primary', '#' + hx);
            st.setProperty('--color-primary-rgb', Math.round(R * 255) + ', ' + Math.round(G * 255) + ', ' + Math.round(B * 255));
            var c3 = shade(80), c4 = shade(70), c6 = shade(51);
            st.setProperty('--color-primary-300', c3.hex);
            st.setProperty('--color-primary-400', c4.hex);
            st.setProperty('--color-primary-400-rgb', c4.rgb.join(', '));
            st.setProperty('--color-primary-600', c6.hex);
            st.setProperty('--color-primary-600-rgb', c6.rgb.join(', '));
            for (var i = 0; i < STOPS.length; i++) {
                st.setProperty('--tw-pink-' + STOPS[i] + '-rgb', shade(LS[i]).rgb.join(' '));
            }
            // 配色派生的其余变量（辅助色、字标色、logo 底色、按钮文字色）由 theme-system.js 算好存在存档里，
            // 这里按名单回放；名单与 theme-system.js 的 EXTRA_VARS 一致
            var vars = (JSON.parse(raw) || {}).vars;
            var ALLOW = ['--v2-blush', '--v2-word', '--v2-aux', '--v2-aux-rgb', '--v2-glow-2', '--v2-tile', '--v2-on-accent', '--v2-bg'];
            if (vars && typeof vars === 'object') {
                for (var j = 0; j < ALLOW.length; j++) {
                    var val = vars[ALLOW[j]];
                    if (typeof val === 'string' && val.length < 64 && /^[#\w(),.\s%-]+$/.test(val)) st.setProperty(ALLOW[j], val);
                }
            }
        } catch (e) { /* 读取失败时回落到 css 默认主题色 */ }
    })();
</script>
<!-- 首帧直达：根据 URL hash 预置初始页面，避免从播放页返回时先渲染首页再切换造成闪动 -->
    <script>
        (function () {
            var n = (location.hash || '').replace('#', '');
            // 私密模式下分类页整体隐藏：hash 直达分类页时首帧就不预置，直接落首页，避免闪动
            try {
                if (n === 'category' && localStorage.getItem('hiddenContentMode') === 'true') {
                    n = 'home';
                    history.replaceState(null, '', (location.pathname || '/') + (location.search || ''));
                }
            } catch (e) { /* localStorage 不可用：按正常模式预置 */ }
            if (n && n !== 'home') {
                document.documentElement.setAttribute('data-init-page', n);
            }
        })();
    </script>

    <!-- 桌面端图标声明 -->
    <link rel="icon" href="/image/brand/leletv-icon-192.png?v=le6" sizes="192x192">
    <link rel="icon" href="/image/brand/leletv-icon-512.png?v=le6" sizes="512x512">

    <!-- marked.js 已移出首屏关键路径：它是 README 弹窗专用的 35KB，且作为 head 里的 defer 脚本
         会排在 dist bundle 之前执行，把 DOMContentLoaded 一起拖晚（启动占位的退场要等它之后的首页就绪）。
         现在由 js/app/app-routing.js 的 ensureMarked() 在第一次进入 README 页时按需加载 -->

    <!-- 首屏启动占位：从主屏/桌面图标冷启动时，HTML 一到达即显示。
         首帧就是最终背景（深色底 + 霓虹粉/樱花白径向光晕），不依赖外部 CSS；
         随后由 body 首部的内联脚本播放「对焦光扫过磨砂玻璃字标」的入场。 -->
    <style>
        /* 底色兜底：样式表（src/styles/variables.css 的 --v2-bg）还在路上时，html/body 的默认背景是白色，
           解析过程中的任何一次重绘都会露出白。先写死深色底，让第一次绘制就是启动层的基底 */
        html, body { background: #0A0A0B; }
        /* 占位期间页面尚未样式化，先按住滚动，避免出现临时滚动条；元素移除后规则自动失效 */
        html:has(#bootSplash) { overflow: hidden; }

        /* 启动层：一束对焦光扫过磨砂玻璃字标，字标在光后面逐渐变清晰。
           首帧只有深底与两团色光，字标由内联 SVG 画出 —— 不依赖外部 CSS / 字体 / 脚本。
           这里的「玻璃」是产品里既有的材质（字标镜面边缘光与主页 #heroWordGlass 同源），
           不是贴在启动页上的一层装饰。 */
        #bootSplash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 26px;
            background:
                radial-gradient(64% 52% at 20% 12%, rgba(var(--v2-aux-rgb, 255, 228, 241), 0.12), transparent 62%),
                radial-gradient(72% 62% at 82% 86%, rgba(var(--v2-accent-rgb, 236, 72, 153), 0.2), transparent 66%),
                var(--v2-bg, #0A0A0B);
            opacity: 1;
            visibility: visible;
            /* 启动层是整页的临时占位：不让误选中、不出现文本光标 */
            user-select: none;
            transition: opacity 0.5s ease 0.1s, visibility 0.5s;
        }
        #bootSplash.boot-splash--done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        /* 鉴权阶段：登录框要盖在启动层（z-index 9999）之上，用户才能直接输入邀请码 */
        #inviteLoginModal.is-boot {
            z-index: 10000;
        }
        /* 退场时先用应用真实背景色铺满启动层，再让字标与遮罩一起离开；
           避免“启动页淡出 → 黑底一帧 → 首页”的跳变 */
        #bootSplash::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 4;
            background: var(--v2-bg, #0A0A0B);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s ease;
        }
        #bootSplash.is-land::after { opacity: 1; }

        /* 环境光：两团极慢漂移的色光，只负责让黑底不像一块死色 */
        .boot-ambient {
            position: absolute;
            inset: -18%;
            z-index: 0;
            pointer-events: none;
            filter: blur(42px);
            opacity: 0.92;
        }
        .boot-ambient i {
            position: absolute;
            display: block;
            border-radius: 9999px;
            will-change: transform;
        }
        .boot-ambient .a {
            top: 4%;
            left: 6%;
            width: 44vmax;
            height: 44vmax;
            background: radial-gradient(circle, rgba(var(--v2-aux-rgb, 255, 228, 241), 0.22), transparent 66%);
            animation: bootDriftA 18s ease-in-out infinite alternate;
        }
        .boot-ambient .b {
            right: -4%;
            bottom: -6%;
            width: 52vmax;
            height: 52vmax;
            background: radial-gradient(circle, rgba(var(--v2-accent-rgb, 236, 72, 153), 0.24), transparent 66%);
            animation: bootDriftB 22s ease-in-out infinite alternate;
        }
        @keyframes bootDriftA {
            from { transform: translate3d(-3%, -2%, 0) scale(1); }
            to   { transform: translate3d(4%, 3%, 0) scale(1.12); }
        }
        @keyframes bootDriftB {
            from { transform: translate3d(3%, 2%, 0) scale(1.06); }
            to   { transform: translate3d(-4%, -3%, 0) scale(1); }
        }

        /* 字标舞台：清晰稿在流内，失焦稿叠在上面，描边光再叠一层。
           大屏（电视 / 2K）上按视口比例放大，小屏仍受 90vw 约束 */
        .boot-word-stack {
            position: relative;
            z-index: 2;
            width: min(90vw, clamp(600px, 50vw, 880px));
            transition: opacity 0.34s ease, transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .boot-word {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 18px 54px rgba(var(--v2-accent-rgb, 236, 72, 153), 0.16));
        }
        /* 描边光层：单独一层，不受清晰稿 / 失焦稿的透明度影响 */
        .boot-word--trace-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            filter: none;
        }
        /* 失焦稿：真实模糊，而不是降低不透明度 —— 合焦时才有“变清楚”的对比。
           首帧就要“认得出是 LeLeTV，只是没对上焦”，所以保持可读、不压到看不见。
           它在流内并垫在最下面，上面的清晰稿靠遮罩一笔一笔揭开 */
        .boot-word--dim {
            position: relative;
            /* 模糊量跟着字标宽度走：手机上字标只有约 350px，固定 8px 会把字糊成一团 */
            filter: blur(clamp(4px, 1.15vw, 8px));
            opacity: 0.7;
            transition: opacity 0.45s ease;
        }
        #bootSplash.is-lit .boot-word--dim { opacity: 0; }
        /* 清晰稿：整层常亮，露出多少由 #bootWordReveal 遮罩里那根粗描边决定 */
        .boot-word--sharp {
            position: absolute;
            inset: 0;
        }

        /* 墨迹：沿笔迹中心线的粗描边，宽度略大于笔画厚度。
           它只出现在 #bootWordReveal 遮罩里，遮罩又是加在字形自身上，所以涂到字外也不会露出来 */
        .boot-ink {
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 92;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 笔尖：一小颗会发光的光点，位置由脚本每帧算 */
        .boot-nib-dot {
            fill: #FFFFFF;
            opacity: 0;
            transition: opacity 0.2s ease;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.95))
                    drop-shadow(0 0 16px rgba(var(--v2-accent-rgb, 236, 72, 153), 0.9));
        }
        #bootSplash.is-tracing .boot-nib-dot { opacity: 1; }

        /* 描边光：一条沿字形轮廓游走的细光，代替竖直扫描带 ——
           光的路径就是字标自己的笔画，不是横穿画面的一条线。
           虚线长度在脚本里按 path 实际长度设置，脚本没跑起来时整圈不可见 */
        .boot-word--trace {
            fill: none;
            stroke: #FFFFFF;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            transition: opacity 0.3s ease;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9))
                    drop-shadow(0 0 12px rgba(var(--v2-accent-rgb, 236, 72, 153), 0.85));
        }
        #bootSplash.is-tracing .boot-word--trace { opacity: 1; }
        #bootSplash.is-lit .boot-word--trace { opacity: 0; transition-duration: 0.55s; }

        /* 合焦完成的一次光释放：粉色球面光从字标中心散开（在“走完最后一笔”那一刻，而不是退场时） */
        .boot-bloom {
            position: absolute;
            left: 50%;
            top: 46%;
            z-index: 1;
            width: min(120vw, 900px);
            height: min(120vw, 900px);
            margin: -min(60vw, 450px) 0 0 -min(60vw, 450px);
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(var(--v2-accent-rgb, 236, 72, 153), 0.5), transparent 62%);
            opacity: 0;
            pointer-events: none;
        }
        #bootSplash.is-lit .boot-bloom { animation: bootBloom 0.85s ease-out both; }
        @keyframes bootBloom {
            0%   { opacity: 0; transform: scale(0.55); }
            22%  { opacity: 0.85; }
            100% { opacity: 0; transform: scale(1.5); }
        }

        /* 读数：一条真实进度线 + 阶段文案 + 百分比。
           宽度与字标同宽 —— 这条细线量的就是整个字标，不是浮在下面的一块小部件。
           百分比用等宽数字：它在测量，是这里唯一“技术感”的正当来源 */
        .boot-loading {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 11px;
            width: min(90vw, clamp(600px, 50vw, 880px));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease 0.2s;
        }
        .boot-loading.is-visible { opacity: 1; }
        .boot-loading-track {
            width: 100%;
            height: 1px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.13);
        }
        .boot-loading-bar {
            display: block;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--v2-blush, #FFE4F1), var(--color-primary, #EC4899));
        }
        .boot-loading-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            font-family: ui-sans-serif, -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .boot-loading-text {
            font-size: 13px;
            line-height: 1;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.66);
        }
        .boot-loading-pct {
            font-size: 13px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0.08em;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.48);
        }

        /* 电视 / 大屏：同一套读数，笔画与字号各加一档，2–3 米外仍读得出 */
        @media (min-width: 1600px) {
            .boot-loading-track { height: 2px; }
            .boot-loading-text,
            .boot-loading-pct { font-size: 14px; }
        }

        /* 退场：字标轻微放大并淡出，读数先撤，背景色随后铺满 */
        #bootSplash.is-burst .boot-word-stack {
            transform: scale(1.035);
            opacity: 0;
        }
        #bootSplash.is-burst .boot-loading {
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* 慢速提示：加载超出预期仍未就绪时出现，给用户主动放行的出口 */
        .boot-splash-hint {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 7%;
            z-index: 5;
            transform: translateX(-50%);
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            text-align: center;
        }
        .boot-splash-hint.is-visible { display: flex; }
        .boot-splash-hint-text {
            font-size: 13px;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.62);
        }
        .boot-splash-hint-btn {
            padding: 8px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.34);
            border-radius: 10px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .boot-splash-hint-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.6);
        }
        .boot-splash-hint-btn:focus-visible {
            outline: 2px solid rgba(var(--v2-accent-rgb, 236, 72, 153), 0.95);
            outline-offset: 3px;
        }

        /* 减弱动效：不描边、不漂移，字标直接清晰显示 */
        @media (prefers-reduced-motion: reduce) {
            .boot-ambient i { animation: none; }
            .boot-word--trace { display: none; }
            .boot-loading { transition-duration: 0.2s; }
            .boot-word-stack { transition-duration: 0.2s; }
        }
    </style>
</head>

            <!-- 笔尖：沿字标自己的笔迹走，写到哪里玻璃就在哪里浮现 -->
            <svg class="boot-word boot-word--trace-layer" viewBox="128 146 780 228" aria-hidden="true">
                <use class="boot-word--trace boot-nib" href="#bootS0"></use>
                <use class="boot-word--trace boot-nib" href="#bootS1"></use>
                <use class="boot-word--trace boot-nib" href="#bootS2"></use>
                <use class="boot-word--trace boot-nib" href="#bootS3"></use>
                <use class="boot-word--trace boot-nib" href="#bootS4"></use>
                <use class="boot-word--trace boot-nib" href="#bootS5"></use>
                <use class="boot-word--trace boot-nib" href="#bootS6"></use>
                <use class="boot-word--trace boot-nib" href="#bootS7"></use>
                <use class="boot-word--trace boot-nib" href="#bootS8"></use>
                <circle class="boot-nib-dot" id="bootNibDot" cx="0" cy="0" r="6.5" transform="translate(-506.6 -77.6)"></circle>
            </svg>
        </div>

        <div class="boot-loading" id="bootLoading" role="status" aria-live="polite" aria-atomic="true">
            <span class="boot-loading-track"><i class="boot-loading-bar" id="bootLoadingBar"></i></span>
            <span class="boot-loading-row">
                <span class="boot-loading-text" id="bootLoadingText">正在准备…</span>
                <span class="boot-loading-pct" id="bootLoadingPct">0%</span>
            </span>
        </div>

        <div class="boot-splash-hint" id="bootSplashHint">
            <span class="boot-splash-hint-text">网络响应较慢，仍在加载</span>
            <button type="button" class="boot-splash-hint-btn" id="bootSplashSkipBtn">直接进入</button>
        </div>
    </div>
    <script>
    (function () {
        'use strict';

        var splash = document.getElementById('bootSplash');
        if (!splash) return;

        var wordSharp = document.getElementById('bootWordSharp');
        var wordDim = document.getElementById('bootStage');
        var wordTrace = document.getElementById('bootWordTrace');
        var wordReveal = document.getElementById('bootRevealStroke');
        var wordPath = document.getElementById('bootWordPath');
        var loadingEl = document.getElementById('bootLoading');
        var loadingBar = document.getElementById('bootLoadingBar');
        var loadingText = document.getElementById('bootLoadingText');
        var loadingPct = document.getElementById('bootLoadingPct');
        var hintEl = document.getElementById('bootSplashHint');
        var hintBtn = document.getElementById('bootSplashSkipBtn');

        // 数据域切换（私密 ↔ 正常）重载：与 js/app/app-routing.js 的 PARTICLE_SWEEP_KEY 同键
        var fromDomainSwitch = false;
        try { fromDomainSwitch = sessionStorage.getItem('leletv_particle_sweep') === '1'; } catch (e) { /* 忽略 */ }
        if (fromDomainSwitch) {
            document.documentElement.setAttribute('data-domain-shown', '1');
        }

        function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
        function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
        function reducedMotion() {
            try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
        }
        // 对焦光带匀速扫过会像进度条；两端各收一点、中段略快，才是一次「推扫合焦」
        function easeInOutQuad(v) { return v < 0.5 ? 2 * v * v : 1 - Math.pow(-2 * v + 2, 2) / 2; }

        // 首帧失焦稿的浓度：要「一眼认出是 LeLeTV，只是没对上焦」，不能淡到像没画
        var DIM_OPACITY = 0.7;

        // ---------- 加载进度 ----------
        // 阶段由 src/boot.ts 推进，这里只负责画：
        //   启动层出现 → 关键样式 12% → DOM 20% → 鉴权 22~35% → 首页 40~95% → 进入 100%
        var CRITICAL_STYLES = ['src/styles/variables.css', 'src/styles/base.css', 'src/pages/home/style.css'];
        var progress = 0;
        var lastProgressAt = now();
        var stall = 0;               // 停滞兜底：缓慢缓推，避免进度条看起来卡死
        var stallPaused = false;     // 等待登录时暂停缓推，进度停在「等待登录」
        var stageText = '';          // 启动编排给出的阶段文案（优先于默认阈值文案）
        var STALL_AFTER_MS = 2500;
        var STALL_RATE = 0.09;
        var SLOW_HINT_MS = 8000;
        var HARD_MAX_MS = 20000;

        var introHeld = false;       // 入场（对焦扫过）已落地
        var appReady = false;        // 交互就绪（业务侧广播）
        var authReady = false;       // 鉴权通过（启动编排通知）
        var homeReady = false;       // 首页数据就绪（启动编排通知）
        var waitingAuth = false;     // 正停在登录门禁：不得把进度推走
        var released = false;        // 已开始退场
        var forced = false;          // 用户主动放行

        function mark(value) {
            if (value <= progress) return;
            progress = value;
            lastProgressAt = now();
        }

        /** 供启动编排调用：推进进度并同步阶段提示 */
        function setStage(value, text) {
            if (typeof value === 'number') mark(clamp01(value));
            if (typeof text === 'string') stageText = text;
        }

        function criticalStylesReady() {
            var links = document.querySelectorAll('link[rel="stylesheet"]');
            var pending = CRITICAL_STYLES.length;
            for (var i = 0; i < links.length; i++) {
                var href = links[i].getAttribute('href') || '';
                for (var j = 0; j < CRITICAL_STYLES.length; j++) {
                    if (href.indexOf(CRITICAL_STYLES[j]) !== -1) {
                        if (!links[i].sheet) return false;
                        pending--;
                    }
                }
            }
            return pending <= 0;
        }

        var stylePolls = 0;
        (function pollStyles() {
            if (criticalStylesReady() || ++stylePolls > 100) { mark(0.12); return; }
            setTimeout(pollStyles, 50);
        })();

        document.addEventListener('readystatechange', function () {
            if (document.readyState === 'interactive') mark(0.2);
        });
        document.addEventListener('DOMContentLoaded', function () {
            mark(0.2);
            // 兜底：业务侧没有广播交互就绪（bundle 失败等）时，8 秒后也要把窗口交出去
            setTimeout(function () {
                if (!appReady && !released) forceArrive();
            }, 8000);
        });
        // 资源 load 不推进进度：首页数据可能仍在加载，
        // 进度只由启动编排的「鉴权 → 首页 → 进入」阶段决定（见 src/boot.ts）。

        // ---------- 读数 ----------
        var shown = 0;
        var lastText = '';
        var lastPct = -1;
        function renderProgress(dt) {
            var target = clamp01(Math.max(progress, stall));
            // 收敛速度按时间算而不是按帧数：低帧率 / 弱网设备上进度条也不会滞后于阶段文案
            var k = 1 - Math.exp(-(dt || 16) / 120);
            shown += (target - shown) * k;
            if (Math.abs(target - shown) < 0.002) shown = target;
            if (loadingBar) loadingBar.style.width = (shown * 100).toFixed(1) + '%';
            var text = stageText || (shown < 0.2 ? '正在准备…'
                : shown < 0.36 ? '正在验证身份…'
                : shown < 0.92 ? '正在加载首页…'
                : '即将进入…');
            if (text !== lastText && loadingText) {
                loadingText.textContent = text;
                lastText = text;
            }
            var pct = Math.round(shown * 100);
            if (pct !== lastPct && loadingPct) {
                loadingPct.textContent = pct + '%';
                lastPct = pct;
            }
        }

        // ---------- 按笔画书写入场 ----------
        // 9 段笔迹（从字形骨架里量出来的中心线，见 #bootS0..#bootS8）按写字顺序连成一条笔路：
        // L → 第一个 e → l → 第二个 e → T 的横 → T 的竖 → V。
        // 笔尖走一段、玻璃就在这一段下面浮现；每段时长按长度分配，不是平均分。
        var SCAN_MS = 1250;
        // 换域回来不再从零启动（页面是新文档，但用户 0.5 秒前才看过这块招牌）：
        // 书写压缩到 880ms，既保留「一笔一笔写」的读法，又不让人在同一个动作上等两遍
        var SWITCH_SCAN_MS = 880;
        var scanMs = fromDomainSwitch ? SWITCH_SCAN_MS : SCAN_MS;
        var TOTAL_MS = scanMs + 260;
        var scanStart = 0;
        var scanDone = false;
        var NIB_LEN = 26;      // 笔尖亮线的长度（路径单位）
        var NIB_LAG = 45;      // 墨迹落后笔尖多少，才有“笔先到、墨随后”的感觉
        var srcPaths = [];     // #bootS0..#bootS8 的引用，用来取笔尖坐标
        var nibDot = document.getElementById('bootNibDot');

        // 每段笔迹的长度只在启动时量一次；量不到就退化成整字直接显示
        var strokeLens = [];
        var strokeTotal = 0;
        function setupTrace() {
            var srcs = [], inks = [], nibs = [];
            for (var i = 0; i < 32; i++) {
                var p = document.getElementById('bootS' + i);
                if (!p) break;
                srcs.push(p);
            }
            srcPaths = srcs;
            var allInk = splash.getElementsByClassName('boot-ink');
            var allNib = splash.getElementsByClassName('boot-nib');
            for (var j = 0; j < allInk.length; j++) inks.push(allInk[j]);
            for (var m = 0; m < allNib.length; m++) nibs.push(allNib[m]);
            strokeLens = [];
            strokeTotal = 0;
            for (var n = 0; n < srcs.length; n++) {
                var len = 0;
                try { len = srcs[n].getTotalLength ? srcs[n].getTotalLength() : 0; } catch (e) { len = 0; }
                strokeLens.push(len);
                strokeTotal += len;
            }
            if (strokeTotal <= 0) {
                for (var q = 0; q < nibs.length; q++) nibs[q].style.display = 'none';
                return;
            }
            for (var s = 0; s < strokeLens.length; s++) {
                var L = strokeLens[s];
                if (inks[s]) {
                    inks[s].style.strokeDasharray = L.toFixed(1) + ' ' + (L * 2 + 40).toFixed(1);
                    inks[s].style.strokeDashoffset = L.toFixed(1);
                }
                if (nibs[s]) {
                    nibs[s].style.strokeDasharray = NIB_LEN + ' ' + (L + NIB_LEN).toFixed(1);
                    nibs[s].style.strokeDashoffset = NIB_LEN;
                }
            }
        }

        // 按进度把「已写长度」分配到各段：笔尖在前，墨迹随后
        function renderTrace(k) {
            var eased = easeInOutQuad(clamp01(k));
            if (strokeTotal <= 0) {
                if (wordDim) wordDim.style.opacity = '0';
                return;
            }
            var written = eased * strokeTotal;
            var acc = 0;
            var dotIdx = -1;
            var dotPos = 0;
            var allInk = splash.getElementsByClassName('boot-ink');
            var allNib = splash.getElementsByClassName('boot-nib');
            for (var i = 0; i < strokeLens.length; i++) {
                var L = strokeLens[i];
                var local = Math.max(0, Math.min(L, written - acc));
                var ink = Math.max(0, Math.min(L, local - NIB_LAG));
                var inkEl = allInk[i], nibEl = allNib[i];
                if (inkEl) inkEl.style.strokeDashoffset = (L - ink).toFixed(1);
                if (nibEl) {
                    if (local >= L) {
                        nibEl.style.strokeDashoffset = (-(L - NIB_LEN)).toFixed(1);
                    } else {
                        nibEl.style.strokeDashoffset = (-(local - NIB_LEN)).toFixed(1);
                    }
                }
                if (local > 0) { dotIdx = i; dotPos = Math.min(local, L); }
                acc += L;
            }
            if (nibDot && dotIdx >= 0 && srcPaths[dotIdx] && srcPaths[dotIdx].getPointAtLength) {
                var pt = srcPaths[dotIdx].getPointAtLength(dotPos);
                nibDot.setAttribute('cx', pt.x.toFixed(1));
                nibDot.setAttribute('cy', pt.y.toFixed(1));
            }
            if (wordDim) wordDim.style.opacity = (DIM_OPACITY * (1 - eased * eased)).toFixed(3);
        }

        function completeScan() {
            if (scanDone) return;
            scanDone = true;
            renderTrace(1);
            splash.classList.remove('is-tracing');
            splash.classList.add('is-lit');
            introHeld = true;
            checkArrive();
        }

        // ---------- 退场闸门 ----------
        // 退场前确认邀请码门禁：未通过时弹窗必须先可见可交互，否则遮罩一撤就是"能看不能点"
        function ensureGate() {
            try {
                var auth = window.INVITE_AUTH;
                if (!auth || typeof auth.isVerified !== 'function') return;
                if (auth.isVerified()) return;
                var modal = document.getElementById('inviteLoginModal');
                if (modal && getComputedStyle(modal).display === 'none') {
                    modal.style.display = 'flex';
                }
            } catch (e) { /* 忽略：宁可正常退场，也不要卡死 */ }
        }

        function burstAndLeave() {
            if (released) return;
            released = true;
            ensureGate();
            completeScan();
            if (loadingEl) loadingEl.classList.remove('is-visible');

            function removeSplash() {
                if (splash.parentNode) splash.parentNode.removeChild(splash);
                // 启动屏完全退场、首页已可见：这时才开始后台预加载其他页面
                if (window.LeLeBoot && typeof window.LeLeBoot.onEntered === 'function') {
                    window.LeLeBoot.onEntered();
                }
            }

            if (fromDomainSwitch) {
                // 换场回来：字标不爆开——爆开是「首次开场」的动作，换场只是把同一块招牌重写一遍，
                // 写完让球面光走完再淡出，把灯交还给页面。
                // 这里的 300 / 900 比首次开场的 380 / 1000 更紧：换场是用户主动点出来的，
                // 不该比首次启动还慢。
                setTimeout(function () { splash.classList.add('boot-splash--done'); }, 300);
                setTimeout(removeSplash, 900);
                return;
            }

            splash.classList.add('is-burst');
            setTimeout(function () { splash.classList.add('is-land'); }, 160);
            setTimeout(function () { splash.classList.add('boot-splash--done'); }, 420);
            setTimeout(removeSplash, 1000);
        }

        // 三闸门：入场动画落地 + 交互就绪 + 鉴权通过 + 首页就绪；谁慢等谁
        function checkArrive() {
            if (released) return;
            if (!introHeld) return;
            if (!forced && !(appReady && authReady && homeReady)) return;
            burstAndLeave();
        }

        function markAppReady() {
            if (appReady || released) return;
            appReady = true;
            // 交互就绪只说明页面点得动；进度仍由鉴权 / 首页阶段推进
            mark(0.2);
            checkArrive();
        }
        // 业务侧（src/main.ts）在 setupEventListeners 之后调用此函数
        window.__LELETV_BOOT_READY__ = markAppReady;
        // 通知首页跳过 playHomeIntro：本启动屏已接管入场视觉，不要播第二遍
        window.__LELETV_BOOT_INTRO__ = true;

        // ---------- 启动编排接口 ----------
        // 顺序由 src/boot.ts 驱动：先鉴权，鉴权通过才 loadHome，
        // 首页就绪后再 homeReady()，三个信号齐了 checkArrive() 才撤启动屏。
        window.__LELETV_BOOT_UI__ = {
            setStage: setStage,
            // 等待登录：进度停在当前阶段，不再自动缓推
            waitAuth: function () {
                waitingAuth = true;
                stallPaused = true;
                if (loadingEl) loadingEl.classList.add('is-visible');
            },
            // 登录成功、开始加载首页：恢复缓推
            resumeProgress: function () {
                waitingAuth = false;
                stallPaused = false;
                lastProgressAt = now();
            },
            authReady: function () {
                if (authReady) return;
                authReady = true;
                waitingAuth = false;
                stallPaused = false;
                lastProgressAt = now();
                mark(0.35);
                checkArrive();
            },
            homeReady: function () {
                if (homeReady) return;
                homeReady = true;
                mark(1);
                checkArrive();
            },
            isReleased: function () { return released; }
        };

        function skipIntro() {
            if (released) return;
            completeScan();
            checkArrive();
        }
        function forceArrive() {
            if (released) return;
            forced = true;
            appReady = true;
            authReady = true;
            homeReady = true;
            waitingAuth = false;
            stageText = '即将进入…';
            completeScan();
            mark(1);
            checkArrive();
        }

        // 点击 / 按键可跳过描边入场；慢速提示里的“直接进入”才会强制撤掉遮罩
        window.addEventListener('pointerdown', skipIntro, { passive: true });
        window.addEventListener('keydown', skipIntro);
        if (hintBtn) hintBtn.addEventListener('click', forceArrive);

        var hintShown = false;
        // 只有「确实停滞」才提示网络慢：等待登录、或进度已接近完成都不算
        function hintDue() {
            if (released || waitingAuth) return false;
            if (progress >= 0.9) return false;
            return now() - lastProgressAt >= STALL_AFTER_MS;
        }
        function scheduleSlowHint(delay) {
            setTimeout(function () {
                if (hintShown || released) return;
                if (hintDue()) {
                    hintShown = true;
                    if (hintEl) hintEl.classList.add('is-visible');
                    return;
                }
                // 本次还不算慢：等登录结束或进度继续推进后再检查
                scheduleSlowHint(1000);
            }, delay);
        }
        scheduleSlowHint(SLOW_HINT_MS);
        setTimeout(function () { forceArrive(); }, HARD_MAX_MS);

        // ---------- 启动 ----------
        splash.classList.add('is-intro');
        setupTrace();
        if (reducedMotion()) {
            // 减少动效：不描边，字标直接清晰显示，只保留进度与退场
            completeScan();
            if (loadingEl) loadingEl.classList.add('is-visible');
        } else {
            splash.classList.add('is-tracing');
            // 换场回来不再重复报一遍加载进度：页面本来就是从上一个域重载的，
            // 读数只会让人以为又要重新加载；字标照样一笔一笔写出来
            if (!fromDomainSwitch) {
                setTimeout(function () {
                    if (!released && loadingEl) loadingEl.classList.add('is-visible');
                }, 300);
            }
        }

        // 动画时长兜底：后台标签页会暂停 rAF，不能让「入场完成」这一信号一直等不到
        setTimeout(function () {
            if (!introHeld && !released) completeScan();
        }, TOTAL_MS + 80);

        // ---------- 主循环：描边入场 + 进度 + 停滞兜底 ----------
        var lastT = 0;
        function tick(nowTs) {
            if (released) return;
            if (!scanStart) scanStart = nowTs;
            var dt = Math.min(40, Math.max(0, nowTs - lastT));
            lastT = nowTs;

            if (!stallPaused && nowTs - lastProgressAt > STALL_AFTER_MS) {
                // 从当前阶段接着往前缓推：否则进度条会在「加载首页」这一段长时间停住
                if (stall < progress) stall = progress;
                stall = clamp01(stall + (dt / 1000) * STALL_RATE);
            }
            renderProgress(dt);

            if (!scanDone && !reducedMotion()) {
                var k = clamp01((nowTs - scanStart) / scanMs);
                if (k >= 1) completeScan();
                else renderTrace(k);
            }

            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    })();
    </script>


    <!-- 全站背景：三团缓慢漂移的径向光，参数见 src/styles/variables.css -->
    <div class="v2-glow" aria-hidden="true"><span class="g-main"></span><span class="g-blush"></span><span class="g-deep"></span></div>

        (function () {

<!-- 启动占位的退场由 body 首部的粒子引擎统一负责（等首页初始化完成后实体化并爆开），
     此处不再重复接管；旧版"关键样式就绪即淡出"的独立退场逻辑已随之移除。 -->
<script>
    (function () {
        // 兜底：万一粒子引擎没跑起来（脚本被拦截/异常），至少保证占位不会永久挡住页面。
        // 注意这里的判据是"引擎脚本是否执行过"（__LELETV_BOOT_READY__ 由引擎在最外层同步赋值），
        // 不能用 __LELETV_BOOT_INTRO__——它只在跑粒子的分支里设置，减弱动效的用户会误触发本兜底
        setTimeout(function () {
            var splash = document.getElementById('bootSplash');
            if (!splash || splash.classList.contains('boot-splash--done')) return;
            if (typeof window.__LELETV_BOOT_READY__ === 'function') return; // 引擎已接管，交给它按动画节奏退场
            splash.classList.add('boot-splash--done');
            setTimeout(function () {
                if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 400);
        }, 9000);
    })();
</script>
